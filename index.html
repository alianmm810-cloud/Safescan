<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8321C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SafeScan">
<title>SafeScan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EE;--card:#fff;--line:#E2DDD4;--ink:#1C1B19;--mute:#6B665E;--red:#B8321C;--green:#1F6F46;--amber:#C9861A;--blue:#1F4E8C}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:84px}
button,input,select,textarea{font-family:inherit;font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--red);display:inline-block}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
.lnk{background:none;border:0;color:var(--red);font-weight:600;cursor:pointer;padding:8px}
.wrap{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h1,h2,h3{margin:0 0 8px;line-height:1.35}
h2{font-size:18px}h3{font-size:16px}
.muted{color:var(--mute);font-size:14px;margin:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:14px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;padding:0 16px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid #CFC8BB;font-weight:600}
.btn[disabled]{opacity:.5}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid #D6D0C5;background:#fff;padding:8px 12px;color:var(--ink)}
textarea{min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.s-ok{background:#E3F1E8;color:#17583A}.s-late{background:#FBEFD5;color:#8A5A00}.s-bad{background:#FBE4DE;color:#A32A16}.s-ws{background:#E2EAF6;color:#1A3F73}.s-none{background:#E9E5DC;color:#4A453D}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #EFEBE3}
.kv:last-child{border:0}.kv span{color:var(--mute);font-size:14px}.kv b{text-align:left}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{font-size:13px;color:var(--mute)}
.stat.on{border-color:var(--ink)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #EFEBE3;cursor:pointer}
.item:last-child{border:0}.item small{display:block;color:var(--mute);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:6px 4px;text-align:center;border-bottom:1px solid #EFEBE3}.tbl th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
.pick{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #EFEBE3}
.pick:last-child{border:0}.pick .t{flex:1;font-size:15px}
.pb{min-width:72px;min-height:44px;border-radius:12px;border:1px solid #D6D0C5;background:#fff;font-weight:600;cursor:pointer}
.pb.ok.on{border:2px solid var(--green);background:#E3F1E8;color:#17583A}
.pb.bad.on{border:2px solid var(--red);background:#FBE4DE;color:#8F2412}
.nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav button{flex:1;min-height:52px;background:none;border:0;font-weight:600;color:var(--mute);cursor:pointer;border-radius:12px}
.nav button.on{color:var(--red)}
.toast{position:fixed;bottom:96px;right:16px;left:16px;max-width:560px;margin:0 auto;background:#1C1B19;color:#fff;padding:12px 16px;border-radius:12px;z-index:9;text-align:center}
.cam{width:100%;border-radius:14px;background:#000;margin:10px 0;max-height:60vh}
.warn{background:#FBEFD5;color:#6E4700;border-radius:12px;padding:10px 12px;font-size:14px}
.err{background:#FBE4DE;color:#8F2412;border-radius:12px;padding:10px 12px;font-size:14px}
.ok{background:#E3F1E8;color:#17583A;border-radius:12px;padding:10px 12px;font-size:14px}
.big{font-size:20px;font-weight:700}
#label{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;text-align:center}
#label canvas,#label img{max-width:100%}
@media print{body *{visibility:hidden}#label,#label *{visibility:visible}#label{position:absolute;top:0;right:0;left:0}.nav,.top,.toast{display:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
<div id="app"><div class="wrap"><div class="card">جارٍ التحميل…</div></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
